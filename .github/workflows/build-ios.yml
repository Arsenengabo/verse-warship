name: Build iOS App

# Runs on GitHub's free macOS cloud runners — no local Mac needed.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "src/**"
      - "capacitor.config.ts"
      - "package.json"
      - ".github/workflows/build-ios.yml"

jobs:
  # ── Stage 1: free, no Apple account needed ──────────────────────────────
  # Compiles the app for the iOS Simulator. This validates the Capacitor/Swift
  # code actually builds, entirely free, with zero Apple Developer setup.
  # It does NOT produce something installable on a real iPhone — that's Stage 2.
  build-simulator:
    runs-on: macos-15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync ios
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

      - name: Build for iOS Simulator (no signing required)
        working-directory: ios/App
        run: |
          xcodebuild -scheme App -workspace App.xcworkspace \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug build CODE_SIGNING_ALLOWED=NO

  # ── Stage 2: requires a paid Apple Developer account ────────────────────
  # Produces a signed .ipa ready for TestFlight/App Store upload.
  # This job only runs once ALL the secrets below exist in your repo — until
  # then it's safely skipped, so Stage 1 keeps working for free in the meantime.
  build-and-archive-signed:
    needs: build-simulator
    runs-on: macos-15
    if: ${{ vars.IOS_SIGNING_READY == 'true' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync ios
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

      # Imports your distribution certificate + provisioning profile into a
      # temporary keychain on the runner so xcodebuild can sign the archive.
      # See DEPLOY_IOS.md for exactly how to produce these secret values.
      - name: Install signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_TEMP_KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/dist_cert.p12
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PROFILE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PROFILE_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Archive and export signed .ipa
        working-directory: ios/App
        run: |
          xcodebuild -scheme App -project App.xcodeproj \
            -configuration Release \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            archive
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload signed .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: verse-warship-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 14
